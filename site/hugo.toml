baseURL = "https://ijeongwoo0109.github.io/MyProfile-LJW/"
title = "이정우의 포트폴리오"
timeZone = "America/New_York"
summaryLength = 10 # see https://gohugo.io/content-management/summaries/#automatic-summary
disableLanguages = [
] # example: ["fr"] for disable french language. see https://gohugo.io/content-management/multilingual/
hasCJKLanguage = false #  If hasCJKLanguage true, auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false

[services]
[services.googleAnalytics]
ID = 'G-MEASUREMENT_ID' # see https://gohugo.io/templates/internal/#configure-google-analytics

[permalinks.page]
"pages" = "/:slugorcontentbasename/"


[pagination]
disableAliases = false
pagerSize = 10
path = 'page'


[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'


[outputs]
home     = ["HTML", "RSS", "WebAppManifest", "SearchIndex", "llms", "llmsfull", "md"]
page     = ["HTML", "RSS", "md"]
section  = ["HTML", "RSS", "md"]
taxonomy = ["HTML", "RSS", "md"]
term     = ["HTML", "RSS", "md"]

[imaging]
resampleFilter = "Lanczos"
[imaging.jpeg]
quality = 80
[imaging.webp]
quality = 80

[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html
lineNumbersInTable = false

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true


[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]


[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"

[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "searchindex"
isPlainText = true
notAlternative = true



